# FormVision — local orchestration
#
# NOTE: this configuration is provided as specified but has NOT been run.
# Docker was not available in the development environment. Treat it as a
# starting point rather than a verified deployment.
#
#   docker compose up --build
#   frontend  http://localhost:3000
#   backend   http://localhost:8000/docs

services:
  backend:
    build:
      context: ./backend
    container_name: formvision-backend
    ports:
      - "8000:8000"
    environment:
      FORMVISION_ENVIRONMENT: production
      FORMVISION_LOG_LEVEL: INFO
      FORMVISION_DATA_DIR: /app/data
      FORMVISION_DATABASE_URL: sqlite:////app/data/formvision.db
      FORMVISION_POSE_MODEL_PATH: /app/models/pose_landmarker_lite.task
      # Must list the origin the browser loads the frontend from. This is the
      # container's view of the outside world, not the service name — the
      # request comes from the user's browser, not from the frontend container.
      FORMVISION_CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      # Uploads, overlays, landmarks, and the database survive a rebuild.
      - backend-data:/app/data
      # The pose model is ~6 MB and downloaded on first analysis; caching it
      # avoids re-downloading on every container start.
      - backend-models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_ variables are inlined at build time, so this is a build
        # arg rather than an environment variable. It is the URL the *browser*
        # uses, which is why it is localhost and not http://backend:8000 —
        # the browser cannot resolve compose service names.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    container_name: formvision-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
  backend-models:
